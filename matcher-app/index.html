<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogy-Business Matcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2d2d2d;
            padding: 15px 20px;
            border-bottom: 2px solid #404040;
        }

        .header h1 {
            font-size: 20px;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
            color: #888;
        }

        .stat-item {
            display: flex;
            gap: 8px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            color: #4CAF50;
            font-weight: 600;
        }

        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .settings-toggle input[type="checkbox"] {
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .settings-toggle label {
            cursor: pointer;
            color: #888;
            font-size: 13px;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #404040;
        }

        .column:last-child {
            border-right: none;
        }

        .column-header {
            background: #252525;
            padding: 12px 15px;
            border-bottom: 1px solid #404040;
        }

        .column-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
        }

        .search-box:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        .list-item {
            padding: 10px 12px;
            margin-bottom: 2px;
            background: #252525;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 13px;
        }

        .list-item:hover {
            background: #2d2d2d;
        }

        .list-item.selected {
            background: #1e4620;
            border-left: 3px solid #4CAF50;
        }

        .item-name {
            font-weight: 500;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .item-address {
            color: #888;
            font-size: 12px;
            margin-bottom: 2px;
        }

        .item-occupation {
            color: #666;
            font-size: 11px;
        }

        .list-item.matched {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1) 0%, rgba(76, 175, 80, 0.05) 100%);
            border-left: 3px solid #4CAF50;
            opacity: 0.6;
            pointer-events: none;
        }

        .list-item.matched .item-name::after {
            content: " ✓";
            color: #4CAF50;
            font-weight: bold;
            margin-left: 5px;
        }

        .list-item.matched .delete-btn,
        .list-item.matched .edit-btn {
            display: none;
        }

        .unmatch-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            background: #FF9800;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .list-item.matched:hover .unmatch-btn {
            opacity: 0.9;
        }

        .unmatch-btn:hover {
            opacity: 1 !important;
            background: #F57C00;
        }

        .matched-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #4CAF50;
            border: 1px solid #45a049;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }

        .matched-badge:hover {
            background: #FF9800;
            border-color: #F57C00;
        }

        .matched-badge:hover::after {
            content: " - Click to unmatch";
            font-weight: normal;
            font-size: 10px;
        }

        .match-panel {
            flex: 0 0 400px;
            background: #252525;
            border-left: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }

        .match-header {
            padding: 15px;
            border-bottom: 1px solid #404040;
        }

        .match-header h2 {
            font-size: 16px;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .match-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .match-section {
            margin-bottom: 20px;
        }

        .match-section h3 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .match-detail {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: #666;
        }

        .detail-value {
            color: #e0e0e0;
            font-weight: 500;
        }

        .match-actions {
            padding: 15px;
            border-top: 1px solid #404040;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-approve {
            background: #4CAF50;
            color: white;
        }

        .btn-approve:hover {
            background: #45a049;
        }

        .btn-reject {
            background: #f44336;
            color: white;
        }

        .btn-reject:hover {
            background: #da190b;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 18px;
            color: #888;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #505050;
        }

        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1e1e1e;
            border-top: 1px solid #404040;
            font-size: 12px;
        }

        .pagination-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pagination-info {
            color: #888;
        }

        .btn-page {
            padding: 6px 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-page:hover:not(:disabled) {
            background: #444;
            border-color: #4CAF50;
        }

        .btn-page:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .filter-input {
            flex: 1;
            padding: 6px 10px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 12px;
        }

        .page-size-select {
            padding: 6px 10px;
            background: #252525;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 12px;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            background: #f44336;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .edit-btn {
            position: absolute;
            top: 8px;
            right: 60px;
            padding: 3px 8px;
            background: #2196F3;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .list-item {
            position: relative;
        }

        .list-item:hover .delete-btn,
        .list-item:hover .edit-btn {
            opacity: 0.9;
        }

        .delete-btn:hover {
            opacity: 1 !important;
            background: #da190b;
        }

        .edit-btn:hover {
            opacity: 1 !important;
            background: #1976D2;
        }

        .list-item.editing {
            background: #2d3a4d;
            border: 2px solid #2196F3;
        }

        .edit-field {
            width: 100%;
            padding: 4px 6px;
            margin: 2px 0;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 3px;
            color: #e0e0e0;
            font-size: 12px;
            font-family: inherit;
        }

        .edit-field:focus {
            outline: none;
            border-color: #2196F3;
        }

        .edit-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .btn-save {
            flex: 1;
            padding: 5px 10px;
            background: #4CAF50;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            padding: 5px 10px;
            background: #666;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #45a049;
        }

        .btn-cancel:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="app" class="loading">Loading data...</div>

    <script>
        let genealogyData = [];
        let businessData = [];
        let allBusinessData = []; // Store ALL business records for matching
        let allGenealogyData = []; // Store ALL genealogy records for matching
        let selectedGenealogy = null;
        let selectedBusiness = null;
        let approvedMatches = [];

        // Pagination state
        let currentPage = 0;
        let pageSize = 100;
        let totalGenealogy = 0;
        let totalBusinesses = 0;

        // Settings
        let showDeleteWarning = true;
        let showDuplicatesOnly = false;
        let showMatchesOnly = false;
        let showAddressMatchesOnly = false;
        let showMatchedRecords = false;

        // Scroll position preservation
        let savedScrollPositions = {
            genealogy: 0,
            business: 0
        };

        // Filter state
        let filters = {
            genName: '',
            genProfession: '',
            genAddress: '',
            busName: '',
            busOccupation: '',
            busAddress: ''
        };

        // Debounce timer
        let filterTimeout = null;

        // Edit state
        let editingRecord = null;  // {type: 'genealogy'|'business', id: string|number}

        // Load data
        async function loadData() {
            try {
                const params = new URLSearchParams({
                    offset: (currentPage * pageSize).toString(),
                    limit: pageSize.toString()
                });

                if (filters.genName) params.append('gen_name', filters.genName);
                if (filters.genProfession) params.append('gen_profession', filters.genProfession);
                if (filters.genAddress) params.append('gen_address', filters.genAddress);
                if (filters.busName) params.append('bus_name', filters.busName);
                if (filters.busOccupation) params.append('bus_occupation', filters.busOccupation);
                if (filters.busAddress) params.append('bus_address', filters.busAddress);

                const response = await fetch(`http://localhost:3030/data?${params}`);
                const data = await response.json();

                genealogyData = data.genealogy;
                businessData = data.businesses;
                totalGenealogy = data.stats.total_genealogy;
                totalBusinesses = data.stats.total_businesses;

                // On first load, fetch ALL business records for matching
                if (allBusinessData.length === 0) {
                    console.log('Loading all business records for name matching...');
                    const allBusParams = new URLSearchParams({
                        offset: '0',
                        limit: '25000' // Get all ~21k business records
                    });
                    const allBusResponse = await fetch(`http://localhost:3030/data?${allBusParams}`);
                    const allBusData = await allBusResponse.json();
                    allBusinessData = allBusData.businesses;
                    console.log(`Loaded ${allBusinessData.length} business records for matching`);
                }

                // On first load, fetch ALL genealogy records for matching
                if (allGenealogyData.length === 0) {
                    console.log('Loading all genealogy records for address matching...');
                    const allGenParams = new URLSearchParams({
                        offset: '0',
                        limit: '130000' // Get all ~124k genealogy records
                    });
                    const allGenResponse = await fetch(`http://localhost:3030/data?${allGenParams}`);
                    const allGenData = await allGenResponse.json();
                    allGenealogyData = allGenData.genealogy;
                    console.log(`Loaded ${allGenealogyData.length} genealogy records for matching`);
                }

                render();
            } catch (error) {
                console.error('Failed to load data:', error);
                document.getElementById('app').innerHTML =
                    '<div class="loading">Failed to load data. Is the server running?</div>';
            }
        }

        function applyFilters() {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(() => {
                currentPage = 0;
                loadData();
            }, 500);
        }

        function updateFilter(key, value) {
            filters[key] = value;
            applyFilters();
        }

        function nextPage() {
            const maxPages = Math.ceil(totalGenealogy / pageSize);
            if (currentPage < maxPages - 1) {
                currentPage++;
                loadData();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                loadData();
            }
        }

        function changePageSize(newSize) {
            pageSize = parseInt(newSize);
            currentPage = 0;
            loadData();
        }

        function saveScrollPositions() {
            const genList = document.getElementById('genealogy-list');
            const busList = document.getElementById('business-list');
            if (genList) savedScrollPositions.genealogy = genList.scrollTop;
            if (busList) savedScrollPositions.business = busList.scrollTop;
        }

        function restoreScrollPositions() {
            setTimeout(() => {
                const genList = document.getElementById('genealogy-list');
                const busList = document.getElementById('business-list');
                if (genList) genList.scrollTop = savedScrollPositions.genealogy;
                if (busList) busList.scrollTop = savedScrollPositions.business;
            }, 50);
        }

        function toggleDeleteWarning() {
            showDeleteWarning = !showDeleteWarning;
            saveScrollPositions();
            render();
            restoreScrollPositions();
        }

        function toggleDuplicatesOnly() {
            showDuplicatesOnly = !showDuplicatesOnly;
            saveScrollPositions();
            render();
            restoreScrollPositions();
        }

        function toggleShowMatchedRecords() {
            showMatchedRecords = !showMatchedRecords;
            saveScrollPositions();
            render();
            restoreScrollPositions();
        }

        async function toggleMatchesOnly() {
            showMatchesOnly = !showMatchesOnly;

            // Just toggle the filter and re-render with current data
            // Pagination will still work and load new sets of 100 records
            saveScrollPositions();
            render();
            restoreScrollPositions();
        }

        async function toggleAddressMatchesOnly() {
            showAddressMatchesOnly = !showAddressMatchesOnly;

            // Toggle the address filter and re-render with current data
            saveScrollPositions();
            render();
            restoreScrollPositions();
        }

        function normalizeName(name) {
            if (!name) return '';
            // Remove periods, extra spaces, and lowercase
            return name.toLowerCase()
                .replace(/\./g, '')  // Remove periods
                .replace(/\s+/g, ' ') // Normalize spaces
                .trim();
        }

        function normalizeAddress(address) {
            if (!address) return '';

            // Lowercase and normalize spaces
            let normalized = address.toLowerCase()
                .replace(/\s+/g, ' ')
                .trim();

            // Normalize common street abbreviations
            normalized = normalized
                .replace(/\bstreet\b/g, 'st')
                .replace(/\broad\b/g, 'rd')
                .replace(/\bavenue\b/g, 'ave')
                .replace(/\blane\b/g, 'ln')
                .replace(/\bdrive\b/g, 'dr')
                .replace(/\bcourt\b/g, 'ct')
                .replace(/\bplace\b/g, 'pl')
                .replace(/\bterrace\b/g, 'ter')
                .replace(/\bsquare\b/g, 'sq')
                .replace(/\byard\b/g, 'yd')
                .replace(/\bbuildings?\b/g, 'bldg')
                .replace(/\bnorth\b/g, 'n')
                .replace(/\bsouth\b/g, 's')
                .replace(/\beast\b/g, 'e')
                .replace(/\bwest\b/g, 'w');

            // Remove periods, commas, and extra spaces
            normalized = normalized
                .replace(/[.,]/g, '')
                .replace(/\s+/g, ' ')
                .trim();

            return normalized;
        }

        function getLastName(name) {
            if (!name) return '';
            // Get the last word in the name (likely the surname)
            const parts = normalizeName(name).split(' ').filter(p => p.length > 1);
            return parts[parts.length - 1] || '';
        }

        function normalizeAddress(address) {
            if (!address) return '';
            return address.toLowerCase()
                .replace(/\s+/g, ' ')
                .replace(/street/g, 'st')
                .replace(/road/g, 'rd')
                .replace(/avenue/g, 'ave')
                .replace(/place/g, 'pl')
                .replace(/[.,]/g, '')
                .trim();
        }

        function fuzzyAddressMatch(addr1, addr2) {
            const norm1 = normalizeAddress(addr1);
            const norm2 = normalizeAddress(addr2);

            if (!norm1 || !norm2) return false;

            // Exact match after normalization
            if (norm1 === norm2) return true;

            // Extract numbers from addresses
            const nums1 = norm1.match(/\d+/g) || [];
            const nums2 = norm2.match(/\d+/g) || [];

            // Remove numbers to compare street names
            const street1 = norm1.replace(/\d+/g, '').trim();
            const street2 = norm2.replace(/\d+/g, '').trim();

            // If street names match and they share any number, consider it a match
            if (street1 && street2 && street1 === street2 && nums1.some(n => nums2.includes(n))) {
                return true;
            }

            // If one address contains the other
            if (norm1.includes(norm2) || norm2.includes(norm1)) {
                return true;
            }

            return false;
        }

        function getFilteredGenealogyData() {
            let filtered = genealogyData;

            // Filter out matched records unless showMatchedRecords is enabled
            if (!showMatchedRecords) {
                filtered = filtered.filter(item => !item.is_matched);
            }

            if (showDuplicatesOnly) {
                // Group by name+address to find duplicates
                const groups = {};
                genealogyData.forEach((item, index) => {
                    const key = `${item.name || ''}|${item.address || ''}`.toLowerCase();
                    if (!groups[key]) {
                        groups[key] = [];
                    }
                    groups[key].push({ item, index });
                });

                // Only keep duplicates (2nd, 3rd, 4th, etc. occurrences)
                const duplicates = [];
                Object.values(groups).forEach(group => {
                    if (group.length > 1) {
                        // Skip the first occurrence, keep the rest
                        for (let i = 1; i < group.length; i++) {
                            duplicates.push(group[i]);
                        }
                    }
                });

                filtered = duplicates.map(d => d.item);
            }

            if (showMatchesOnly || showAddressMatchesOnly) {
                // Match against ALL business records, not just the paginated 100
                const businessNames = new Set(allBusinessData.map(b => normalizeName(b.name)));
                const businessAddresses = new Set(allBusinessData.map(b => normalizeAddress(b.address)));

                // Debug: show first 5 of each
                if (filtered.length > 0 && allBusinessData.length > 0) {
                    if (showMatchesOnly) {
                        console.log('Sample genealogy names:', filtered.slice(0, 5).map(g => `"${g.name}" -> "${normalizeName(g.name)}"`));
                    }
                    if (showAddressMatchesOnly) {
                        console.log('Sample genealogy addresses:', filtered.slice(0, 5).map(g => `"${g.address}" -> "${normalizeAddress(g.address)}"`));
                    }
                    console.log(`Matching against ${allBusinessData.length} total business records`);
                }

                filtered = filtered.filter(genItem => {
                    const genName = normalizeName(genItem.name);
                    const genAddress = normalizeAddress(genItem.address);

                    let nameMatch = true;
                    let addressMatch = true;

                    // Check name if that filter is on
                    if (showMatchesOnly) {
                        nameMatch = businessNames.has(genName);
                    }

                    // Check address if that filter is on
                    if (showAddressMatchesOnly) {
                        addressMatch = businessAddresses.has(genAddress);
                    }

                    // Both filters must pass if both are enabled
                    return nameMatch && addressMatch;
                });

                const filterType = showMatchesOnly && showAddressMatchesOnly ? 'name+address' :
                                   showMatchesOnly ? 'name' : 'address';
                console.log(`Found ${filtered.length} ${filterType} matches on this page (out of ${genealogyData.length} loaded)`);
            }

            return filtered;
        }

        function getFilteredBusinessData() {
            // When showing matches only, use ALL business data and filter to matching names/addresses
            let filtered = (showMatchesOnly || showAddressMatchesOnly) ? allBusinessData : businessData;

            // Filter out matched records unless showMatchedRecords is enabled
            if (!showMatchedRecords) {
                filtered = filtered.filter(item => !item.is_matched);
            }

            if (!showMatchesOnly && !showAddressMatchesOnly) {
                return filtered;
            }

            // If a genealogy record is selected and filters are on, show only matches for that specific record
            if (selectedGenealogy && (showMatchesOnly || showAddressMatchesOnly)) {
                const selectedGenName = normalizeName(selectedGenealogy.name);
                const selectedGenAddress = normalizeAddress(selectedGenealogy.address);

                filtered = filtered.filter(busItem => {
                    const busName = normalizeName(busItem.name);
                    const busAddress = normalizeAddress(busItem.address);

                    let nameMatch = true;
                    let addressMatch = true;

                    // Check name if that filter is on
                    if (showMatchesOnly) {
                        nameMatch = (busName === selectedGenName);
                    }

                    // Check address if that filter is on
                    if (showAddressMatchesOnly) {
                        addressMatch = (busAddress === selectedGenAddress);
                    }

                    // Both filters must pass if both are enabled
                    return nameMatch && addressMatch;
                });

                console.log(`Showing ${filtered.length} matches for selected genealogy record`);
                return filtered;
            }

            // Get genealogy names and addresses from ALL genealogy data (not just current page)
            const genealogyNames = new Set(allGenealogyData.map(g => normalizeName(g.name)));
            const genealogyAddresses = new Set(allGenealogyData.map(g => normalizeAddress(g.address)));

            filtered = filtered.filter(busItem => {
                const busName = normalizeName(busItem.name);
                const busAddress = normalizeAddress(busItem.address);

                let nameMatch = true;
                let addressMatch = true;

                // Check name if that filter is on
                if (showMatchesOnly) {
                    nameMatch = genealogyNames.has(busName);
                }

                // Check address if that filter is on
                if (showAddressMatchesOnly) {
                    addressMatch = genealogyAddresses.has(busAddress);
                }

                // Both filters must pass if both are enabled
                return nameMatch && addressMatch;
            });

            console.log(`Showing ${filtered.length} matching business records`);
            return filtered;
        }

        async function unmatchRecord(genId, name) {
            const confirmed = confirm(
                `Unmatch this record?\n\n${name}\n\nThis will remove the business link.`
            );
            if (!confirmed) return;

            try {
                const response = await fetch('http://localhost:3030/unmatch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ gen_id: genId })
                });

                const result = await response.json();
                if (result.success) {
                    saveScrollPositions();
                    await loadData();

                    // Reload ALL business data
                    const allBusParams = new URLSearchParams({ offset: '0', limit: '25000' });
                    const allBusResponse = await fetch(`http://localhost:3030/data?${allBusParams}`);
                    const allBusData = await allBusResponse.json();
                    allBusinessData = allBusData.businesses;

                    render();
                    restoreScrollPositions();
                } else {
                    alert('Failed to unmatch: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Failed to unmatch record:', error);
                alert('Failed to unmatch record');
            }
        }

        async function unmatchBusinessRecord(businessName, businessYear) {
            const confirmed = confirm(
                `Unmatch this business record?\n\n${businessName} (${businessYear})\n\nThis will remove the link from the genealogy record.`
            );
            if (!confirmed) return;

            try {
                const response = await fetch('http://localhost:3030/unmatch_by_business', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        business_name: businessName,
                        business_year: businessYear
                    })
                });

                const result = await response.json();
                if (result.success) {
                    saveScrollPositions();

                    // Reload ALL business data
                    const allBusParams = new URLSearchParams({ offset: '0', limit: '25000' });

                    allBusinessData = allBusData.businesses;

                } else {

                }
            } catch (error) {

                alert('Failed to unmatch record');
            }
        }

        async function deleteRecord(type, id, name, address) {
            const typeName = type === 'genealogy' ? 'Genealogy' : 'Business';

            if (showDeleteWarning) {
                const confirmed = confirm(
                    `Delete ${typeName} record?\n\n${name}\n\nThis cannot be undone.`
                );
                if (!confirmed) return;
            }

            try {
                const payload = {
                    record_type: type,
                    record_id: id
                };

                // For genealogy records, also send name and address for identification
                if (type === 'genealogy') {
                    payload.name = name;
                    payload.address = address;
                }

                const response = await fetch('http://localhost:3030/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.success) {
                    saveScrollPositions();
                    await loadData(); // Reload current page
                    restoreScrollPositions();
                } else {
                    alert('Failed to delete: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Failed to delete record:', error);
                alert('Failed to delete record');
            }
        }

        async function saveEdit(type, id, oldName, oldAddress) {
            try {
                let data;
                const endpoint = type === 'genealogy' ? 'update_genealogy' : 'update_business';

                if (type === 'genealogy') {
                    data = {
                        id: id,
                        old_name: oldName,
                        old_address: oldAddress,
                        name: document.getElementById(`edit-name-${id}-${oldName}`).value,
                        address: document.getElementById(`edit-address-${id}-${oldName}`).value,
                        profession: document.getElementById(`edit-profession-${id}-${oldName}`).value
                    };
                } else {
                    const fullName = document.getElementById(`edit-name-${id}`).value;
                    const nameParts = fullName.trim().split(' ');
                    const surname = nameParts.length > 0 ? nameParts[nameParts.length - 1] : '';
                    const forename = nameParts.length > 1 ? nameParts.slice(0, -1).join(' ') : '';

                    data = {
                        id: id,
                        surname: surname,
                        forename: forename,
                        occupation: document.getElementById(`edit-occupation-${id}`).value,
                        address: document.getElementById(`edit-address-${id}`).value
                    };
                }

                const response = await fetch(`http://localhost:3030/${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    editingRecord = null;
                    saveScrollPositions();
                    await loadData(); // Reload to show updated data
                    restoreScrollPositions();
                } else {
                    alert('Failed to update: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Failed to update record:', error);
                alert('Failed to update record');
            }
        }

        async function approveMatch() {
            if (!selectedGenealogy || !selectedBusiness) return;

                genealogy: selectedGenealogy,
                business: selectedBusiness

            try {
                const response = await fetch('http://localhost:3030/approve', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        gen_id: selectedGenealogy.id,
                        business_id: selectedBusiness.id,
                        business_name: selectedBusiness.name,
                        business_occupation: selectedBusiness.occupation,
                        business_address: selectedBusiness.address,
                        business_year: selectedBusiness.year
                    })
                });

                if (response.ok) {
                    console.log('Match approved, reloading data...');
                    selectedGenealogy = null;
                    selectedBusiness = null;
                    saveScrollPositions();

                    // Reload genealogy data
                    await loadData();

                    // Reload ALL business data to update is_matched status
                    const allBusParams = new URLSearchParams({
                        offset: '0',
                        limit: '25000'
                    });
                    const allBusResponse = await fetch(`http://localhost:3030/data?${allBusParams}`);
                    const allBusData = await allBusResponse.json();
                    allBusinessData = allBusData.businesses;
                    console.log('Reloaded business data with updated match status');

                    render();
                    restoreScrollPositions();
                } else {
                    alert('Failed to approve match');
                }
            } catch (error) {
                console.error('Failed to approve match:', error);
                alert('Failed to save match');

        // Keyboard navigation
        function handleKeyDown(event) {
            // Ignore if user is typing in an input field
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }

            if (event.key === 'ArrowUp') {
                event.preventDefault();
                navigateUp();
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                navigateDown();
            }
        }

        function navigateUp() {
            if (selectedGenealogy && selectedGenealogy._index !== undefined) {
                // Navigate genealogy list
                const newIndex = selectedGenealogy._index - 1;
                if (newIndex >= 0 && newIndex < genealogyData.length) {
                    selectGenealogy(genealogyData[newIndex], newIndex);
                    scrollToSelected('genealogy-list', newIndex);
                }
            } else if (selectedBusiness && selectedBusiness._index !== undefined) {
                // Navigate business list
                const newIndex = selectedBusiness._index - 1;
                if (newIndex >= 0 && newIndex < businessData.length) {
                    selectBusiness(businessData[newIndex], newIndex);
                    scrollToSelected('business-list', newIndex);
                }
            }
        }

        function navigateDown() {
            if (selectedGenealogy && selectedGenealogy._index !== undefined) {
                // Navigate genealogy list
                const newIndex = selectedGenealogy._index + 1;
                if (newIndex >= 0 && newIndex < genealogyData.length) {
                    selectGenealogy(genealogyData[newIndex], newIndex);
                    scrollToSelected('genealogy-list', newIndex);
                }
            } else if (selectedBusiness && selectedBusiness._index !== undefined) {
                // Navigate business list
                const newIndex = selectedBusiness._index + 1;
                if (newIndex >= 0 && newIndex < businessData.length) {
                    selectBusiness(businessData[newIndex], newIndex);
                    scrollToSelected('business-list', newIndex);
                }
            }
        }

        function scrollToSelected(listId, index) {
            // Wait for render to complete
            setTimeout(() => {
                const listContainer = document.getElementById(listId);
                if (listContainer) {
                    const items = listContainer.querySelectorAll('.list-item');
                    if (items[index]) {
                        items[index].scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest'
                        });
                    }
                }
            }, 50);
        }

        // Add keyboard event listener
        document.addEventListener('keydown', handleKeyDown);

        // Initialize
        loadData();
    </script>
</body>
</html>
