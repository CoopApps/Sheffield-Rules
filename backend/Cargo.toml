[package]
name = "saturday_at_three"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-rt = "2"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "migrate", "macros"] }
rusqlite = { version = "0.30", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# File operations for assets
tokio-util = "0.7"

# CORS support
actix-cors = "0.7"

# Image handling
image = "0.24"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "saturday_at_three"
path = "src/main.rs"
