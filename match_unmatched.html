<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheffield Census Matcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4a9eff;
        }

        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: #b0b0b0;
        }

        input, select {
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #2a2a2a;
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #4a9eff;
        }

        .stat-label {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 5px;
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .column {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
        }

        .column h2 {
            margin-bottom: 15px;
            color: #4a9eff;
            font-size: 18px;
        }

        .records-list {
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .record-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px;
            cursor: move;
            transition: all 0.2s;
        }

        .record-card:hover {
            border-color: #4a9eff;
            transform: translateX(5px);
        }

        .record-card.dragging {
            opacity: 0.5;
        }

        .record-card.drag-over {
            border-color: #00ff00;
            background: #2a3a2a;
        }

        .record-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .record-details {
            font-size: 13px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .record-detail {
            display: flex;
            gap: 8px;
        }

        .record-label {
            color: #888;
            min-width: 80px;
        }

        .record-value {
            color: #e0e0e0;
        }

        .no-records {
            text-align: center;
            color: #666;
            padding: 40px;
            font-style: italic;
        }

        .match-button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
        }

        .match-button:hover {
            background: #357abd;
        }

        .match-button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #4a9eff;
            font-size: 18px;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #00aa00;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scrollbar::-webkit-scrollbar {
            width: 10px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 5px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sheffield Census Matcher</h1>

        <div id="message"></div>

        <div class="controls">
            <div class="control-group">
                <label for="year-filter">Year</label>
                <select id="year-filter">
                    <option value="">All Years</option>
                </select>
            </div>
            <div class="control-group">
                <label for="sheffield-search">Search Sheffield</label>
                <input type="text" id="sheffield-search" placeholder="Search by name...">
            </div>
            <div class="control-group">
                <label for="genealogy-search">Search Genealogy</label>
                <input type="text" id="genealogy-search" placeholder="Search by name...">
            </div>
            <div class="control-group">
                <label for="limit">Records per side</label>
                <select id="limit">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                </select>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="total-sheffield">-</div>
                <div class="stat-label">Sheffield Records</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="total-genealogy">-</div>
                <div class="stat-label">Genealogy Records</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="showing-sheffield">-</div>
                <div class="stat-label">Showing Sheffield</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="showing-genealogy">-</div>
                <div class="stat-label">Showing Genealogy</div>
            </div>
        </div>

        <div class="columns">
            <div class="column">
                <h2>Sheffield Census (drag from here)</h2>
                <div id="sheffield-list" class="records-list scrollbar">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            <div class="column">
                <h2>Genealogy Records (drop here to match)</h2>
                <div id="genealogy-list" class="records-list scrollbar">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';
        let sheffieldRecords = [];
        let genealogyRecords = [];
        let filteredSheffield = [];
        let filteredGenealogy = [];

        // Load data on page load
        async function init() {
            try {
                await Promise.all([
                    loadYears(),
                    loadRecords()
                ]);
            } catch (error) {
                showError('Failed to initialize: ' + error.message);
            }
        }

        async function loadYears() {
            const response = await fetch(`${API_URL}/years`);
            const years = await response.json();

            const yearSelect = document.getElementById('year-filter');
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
        }

        async function loadRecords() {
            const year = document.getElementById('year-filter').value;
            const limit = document.getElementById('limit').value;
            const sheffieldSearch = document.getElementById('sheffield-search').value;
            const genealogySearch = document.getElementById('genealogy-search').value;

            const params = new URLSearchParams();
            if (year) params.append('year', year);
            params.append('limit', limit);
            if (sheffieldSearch) params.append('sheffield_search', sheffieldSearch);
            if (genealogySearch) params.append('genealogy_search', genealogySearch);

            const response = await fetch(`${API_URL}/records?${params}`);
            const data = await response.json();

            sheffieldRecords = data.sheffield;
            genealogyRecords = data.genealogy;
            filteredSheffield = data.sheffield;
            filteredGenealogy = data.genealogy;

            updateStats(data.stats);
            renderSheffield();
            renderGenealogy();
        }

        function updateStats(stats) {
            document.getElementById('total-sheffield').textContent = stats.total_sheffield.toLocaleString();
            document.getElementById('total-genealogy').textContent = stats.total_genealogy.toLocaleString();
            document.getElementById('showing-sheffield').textContent = filteredSheffield.length.toLocaleString();
            document.getElementById('showing-genealogy').textContent = filteredGenealogy.length.toLocaleString();
        }

        function renderSheffield() {
            const container = document.getElementById('sheffield-list');

            if (filteredSheffield.length === 0) {
                container.innerHTML = '<div class="no-records">No records found</div>';
                return;
            }

            container.innerHTML = filteredSheffield.map(record => `
                <div class="record-card" draggable="true" data-id="${record.id}" data-type="sheffield">
                    <div class="record-name">${record.name}</div>
                    <div class="record-details">
                        <div class="record-detail">
                            <span class="record-label">Year:</span>
                            <span class="record-value">${record.year}</span>
                        </div>
                        ${record.age ? `
                        <div class="record-detail">
                            <span class="record-label">Age:</span>
                            <span class="record-value">${record.age} (b. ${record.birth_year || 'unknown'})</span>
                        </div>
                        ` : ''}
                        ${record.gender ? `
                        <div class="record-detail">
                            <span class="record-label">Gender:</span>
                            <span class="record-value">${record.gender}</span>
                        </div>
                        ` : ''}
                        ${record.birth_place ? `
                        <div class="record-detail">
                            <span class="record-label">Birth Place:</span>
                            <span class="record-value">${record.birth_place}</span>
                        </div>
                        ` : ''}
                        ${record.civil_parish ? `
                        <div class="record-detail">
                            <span class="record-label">Civil Parish:</span>
                            <span class="record-value">${record.civil_parish}</span>
                        </div>
                        ` : ''}
                        ${record.relation ? `
                        <div class="record-detail">
                            <span class="record-label">Relation:</span>
                            <span class="record-value">${record.relation}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            // Add drag event listeners
            container.querySelectorAll('.record-card').forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
            });
        }

        function renderGenealogy() {
            const container = document.getElementById('genealogy-list');

            if (filteredGenealogy.length === 0) {
                container.innerHTML = '<div class="no-records">No records found</div>';
                return;
            }

            container.innerHTML = filteredGenealogy.map(record => `
                <div class="record-card" data-id="${record.id}" data-type="genealogy">
                    <div class="record-name">${record.name}</div>
                    <div class="record-details">
                        <div class="record-detail">
                            <span class="record-label">Year:</span>
                            <span class="record-value">${record.year}</span>
                        </div>
                        ${record.age ? `
                        <div class="record-detail">
                            <span class="record-label">Age:</span>
                            <span class="record-value">${record.age} (b. ${record.birth_year || 'unknown'})</span>
                        </div>
                        ` : ''}
                        ${record.address ? `
                        <div class="record-detail">
                            <span class="record-label">Address:</span>
                            <span class="record-value">${record.address}</span>
                        </div>
                        ` : ''}
                        ${record.profession ? `
                        <div class="record-detail">
                            <span class="record-label">Profession:</span>
                            <span class="record-value">${record.profession}</span>
                        </div>
                        ` : ''}
                        ${record.spouse ? `
                        <div class="record-detail">
                            <span class="record-label">Spouse:</span>
                            <span class="record-value">${record.spouse}</span>
                        </div>
                        ` : ''}
                        ${record.birth_place ? `
                        <div class="record-detail">
                            <span class="record-label">Birth Place:</span>
                            <span class="record-value">${record.birth_place}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            // Add drop event listeners
            container.querySelectorAll('.record-card').forEach(card => {
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragleave', handleDragLeave);
            });
        }

        let draggedElement = null;

        function handleDragStart(e) {
            draggedElement = e.currentTarget;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.currentTarget.innerHTML);
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        async function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.preventDefault();

            const target = e.currentTarget;
            target.classList.remove('drag-over');

            if (!draggedElement) return;

            const sheffieldId = draggedElement.dataset.id;
            const genealogyId = target.dataset.id;

            if (confirm(`Match these records?\n\nSheffield: ${draggedElement.querySelector('.record-name').textContent}\nGenealogy: ${target.querySelector('.record-name').textContent}`)) {
                try {
                    const response = await fetch(`${API_URL}/match`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sheffieldId, genealogyId })
                    });

                    if (response.ok) {
                        showSuccess('Match saved successfully!');

                        // Remove both records from display
                        draggedElement.remove();
                        target.remove();

                        // Update stats
                        filteredSheffield = filteredSheffield.filter(r => r.id !== sheffieldId);
                        filteredGenealogy = filteredGenealogy.filter(r => r.id !== genealogyId);
                        document.getElementById('showing-sheffield').textContent = filteredSheffield.length.toLocaleString();
                        document.getElementById('showing-genealogy').textContent = filteredGenealogy.length.toLocaleString();
                    } else {
                        const error = await response.json();
                        showError('Failed to save match: ' + error.error);
                    }
                } catch (error) {
                    showError('Failed to save match: ' + error.message);
                }
            }

            draggedElement = null;
            return false;
        }

        function showError(message) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => msgDiv.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = `<div class="success">${message}</div>`;
            setTimeout(() => msgDiv.innerHTML = '', 3000);
        }

        // Event listeners
        document.getElementById('year-filter').addEventListener('change', loadRecords);
        document.getElementById('limit').addEventListener('change', loadRecords);
        document.getElementById('sheffield-search').addEventListener('input', loadRecords);
        document.getElementById('genealogy-search').addEventListener('input', loadRecords);

        // Initialize
        init();
    </script>
</body>
</html>
